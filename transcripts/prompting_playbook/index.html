<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Prompting Playbook — Transcript Intelligence</title>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--heading:#f0f6fc;--link:#58a6ff;--accent:#7c3aed;--accent-dim:#3b0764;}
  .light{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--border:#d0d7de;--text:#24292f;--muted:#57606a;--heading:#1c2128;--link:#0969da;--accent:#7c3aed;--accent-dim:#ede9fe;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;}
  #pb{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#7c3aed,#a78bfa);z-index:1000;transition:width .1s}
  .topbar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;gap:16px;z-index:100;flex-wrap:wrap}
  .topbar-title{font-size:13px;font-weight:600;color:var(--muted);flex:1}
  .tabs{display:flex;gap:4px}
  .tab{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .tab-panel{display:none}.tab-panel.active{display:block}
  iframe{width:100%;border:none;height:calc(100vh - 49px)}

/* ── GENERIC MOBILE GUARD (2026-09-05) ──
   These pages have no sidebar layout, but <main> is still a flex/grid child
   with the default min-width:auto and refused to shrink: the conference
   spark_cannon page measured 452px in a 375px viewport. Container-agnostic
   because this template revision varies. */
@media (max-width: 768px) {
  main, .main { min-width: 0; overflow-wrap: break-word; }
  table { display: block; width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table > thead, table > tbody, table > tfoot { display: table; width: max-content; min-width: 100%; }
  img, pre { max-width: 100%; }
}
</style>
</head>
<body>
<div id="pb" style="width:0%"></div>
<div class="topbar">
  <div class="topbar-title">The Prompting Playbook — Margot Vanlar · Code with Claude 2026</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('echo',this)">⚡ Echo</button>
    <button class="tab" onclick="showTab('spark',this)">📋 Spark & Cannon</button>
  </div>
  <button class="toggle" onclick="document.body.classList.toggle('light')">☀ Light</button>
</div>
<div id="echo" class="tab-panel active">
  <iframe src="echo.html" id="echo-frame"></iframe>
</div>
<div id="spark" class="tab-panel">
  <iframe src="spark_cannon.html" id="spark-frame"></iframe>
</div>
<script>
function showTab(name,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  btn.classList.add('active');
}
window.addEventListener('scroll',()=>{const el=document.documentElement;const st=el.scrollTop||document.body.scrollTop;const sh=el.scrollHeight-el.clientHeight;document.getElementById('pb').style.width=(sh>0?(st/sh*100):0)+'%';});
</script>
</body>
</html>
