name: Update Ticker Data

on:
  schedule:
    - cron: '15 */3 * * *'   # every 3 hours at :15 (reduced from hourly to cut commit noise)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch equity/macro quotes from Yahoo Finance
        run: node scripts/fetch-ticker.js

      - name: Publish ticker to the ticker-data branch (keeps main history clean)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build a tree with just data/ticker.json via plumbing — no branch checkout, so the
          # runner's main checkout is untouched and main gets ZERO ticker commits. The client
          # reads this branch from raw.githubusercontent (CORS-enabled, ~5min cache).
          BLOB=$(git hash-object -w data/ticker.json)
          SUB=$(printf '100644 blob %s\tticker.json\n' "$BLOB" | git mktree)
          ROOT=$(printf '040000 tree %s\tdata\n' "$SUB" | git mktree)
          for i in 1 2 3 4 5; do
            git fetch -q origin ticker-data || true
            PARENT=$(git rev-parse -q --verify origin/ticker-data || true)
            if [ -n "$PARENT" ] && [ "$(git rev-parse "$PARENT^{tree}")" = "$ROOT" ]; then
              echo "No ticker change."; exit 0
            fi
            if [ -n "$PARENT" ]; then
              COMMIT=$(git commit-tree "$ROOT" -p "$PARENT" -m "chore(ticker): update equity/macro quotes")
            else
              COMMIT=$(git commit-tree "$ROOT" -m "chore(ticker): update equity/macro quotes")
            fi
            if git push origin "$COMMIT:refs/heads/ticker-data"; then
              echo "Pushed ticker-data on attempt $i."; exit 0
            fi
            echo "Push rejected (attempt $i), retrying..."; sleep 3
          done
          echo "Failed to push ticker-data after 5 attempts." >&2; exit 1
