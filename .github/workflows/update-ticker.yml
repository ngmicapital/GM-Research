name: Update Ticker Data

on:
  schedule:
    - cron: '15 * * * *'   # every hour at :15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch equity/macro quotes from Yahoo Finance
        run: node scripts/fetch-ticker.js

      - name: Commit ticker data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ticker.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(ticker): update equity/macro quotes"
          # Retry-with-rebase: handles the case where another commit lands on main
          # while this job was running (otherwise `git push` is rejected).
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main (attempt $i)..."
            git pull --rebase origin main
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1
