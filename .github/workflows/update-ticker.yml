name: Update Ticker Data

on:
  schedule:
    - cron: '15 * * * *'   # every hour at :15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch equity/macro quotes from Yahoo Finance
        run: node scripts/fetch-ticker.js

      - name: Commit ticker data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ticker.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(ticker): update equity/macro quotes"
            git push
          fi
