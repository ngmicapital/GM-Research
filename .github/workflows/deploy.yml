name: Build & Deploy Briefings Site

on:
  push:
    branches: [main]
    # Hourly ticker-only commits (data/ticker.json, pushed by update-ticker.yml)
    # must NOT trigger a full site rebuild + Pages deploy. The page reads
    # ticker.json same-origin, and it gets republished on the next content
    # deploy (briefings publish several times daily). Equity/macro quotes are
    # daily-granularity; crypto is fetched live client-side from CoinGecko.
    paths-ignore:
      - 'data/ticker.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Debounce concurrent pushes
        run: sleep 30
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Briefings push straight to main and never pass through ci.yml, so the
      # unit suites must also gate here or daily publishes run zero tests.
      # ~350ms total; a failure blocks the deploy and notify-failure.yml alerts.
      - name: Unit tests
        run: node --test scripts/lib/lib.test.js scripts/lib/render.test.js scripts/lib/publish.test.js
      - run: node scripts/generate-index.js
      - run: node scripts/generate-visualizations.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
